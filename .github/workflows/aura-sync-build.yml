name: Aura Sync desktop builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'aura-sync-v*'

jobs:
  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-sync/package-lock.json
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: aura-sync-linux
          path: |
            desktop-sync/release/*.deb
            desktop-sync/release/*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-sync/package-lock.json
      - run: npm ci
      - run: npm run dist:windows
      - uses: actions/upload-artifact@v4
        with:
          name: aura-sync-windows
          path: |
            desktop-sync/release/*.exe
            desktop-sync/release/*.blockmap
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/aura-sync-v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aura-sync-*
          path: release-assets
          merge-multiple: true
      - name: Publish desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --title "Aura Sync ${TAG#aura-sync-v}" \
            --notes "Aura Sync desktop companion update. Includes Linux .deb/AppImage and Windows .exe. This release fixes clipboard polling and improves local media classification and cross-device Focus pausing. Media classification uses player/app/title metadata locally; it does not capture screen or audio."
